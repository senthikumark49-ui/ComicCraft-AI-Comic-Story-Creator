<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">AI COMIC STORY CREATOR</p>
      <h1>ComicCraft</h1>
      <p>Turn one idea into a five-panel illustrated comic.</p>
    </section>

    {% if error %}
    <div class="error"><strong>Generation failed:</strong> {{ error }}</div>
    {% endif %}

    <form action="/generate" method="post" class="card">
      <label>Story Prompt
        <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest..."></textarea>
      </label>

      <label>Main Character Name
        <input name="character_name" value="Alex" required>
      </label>

      <label>Setting
        <select name="setting">
          <option>enchanted forest</option>
          <option>school</option>
          <option>future city</option>
          <option>outer space</option>
          <option>underwater world</option>
        </select>
      </label>

      <label>Story Tone
        <select name="tone">
          <option>dramatic</option>
          <option>light-hearted</option>
          <option>funny</option>
          <option>poetic</option>
          <option>mysterious</option>
        </select>
      </label>

      <label>Art Style
        <select name="art_style">
          <option>comic book</option>
          <option>anime</option>
          <option>pixel art</option>
          <option>realistic</option>
        </select>
      </label>

      <button type="submit">✨ Generate My Comic</button>
      <p class="hint">Generation may take several minutes because five images are created.</p>
    </form>
  </main>
</body>
</html>
