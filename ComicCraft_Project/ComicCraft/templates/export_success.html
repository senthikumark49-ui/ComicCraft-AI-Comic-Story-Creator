<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Export Success - ComicCraft</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <section class="card success">
      <h1>🎉 Comic Export Ready!</h1>
      <p>Your comic PDF has been created successfully.</p>
      {% if pdf_path %}
      <a class="button" href="{{ pdf_path }}" download>Download PDF</a>
      {% endif %}
      <a class="button secondary" href="/">Go Create Another Comic</a>
    </section>
  </main>
</body>
</html>
